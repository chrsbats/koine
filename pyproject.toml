[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "koine"
version = "0.11.0"
authors = [
  { name="Chris Bates", email="1314008+chrsbats@users.noreply.github.com" },
]
description = "A declarative, data-driven parser generator for creating languages, ASTs, and transpilers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: C++",
    "Topic :: Software Development :: Compilers",
    "Topic :: Text Processing :: General",
]

dependencies = [
    "parsimonious>=0.10",
    "safer-yaml>=0.1.1",
]

[project.urls]
"Homepage" = "https://github.com/chrsbats/koine"
"Bug Tracker" = "https://github.com/chrsbats/koine/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-subtests",
]

[tool.setuptools]
packages = ["koine"]
package-dir = { koine = "reference/koine" }
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
